<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TurfBook - Admin Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .admin-login-section {
            min-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .admin-login-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .admin-login-box h2 {
            margin-bottom: 10px;
        }

        .admin-login-box p {
            margin-bottom: 25px;
            color: #666;
        }

        .admin-login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .admin-login-box button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #198754;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .admin-login-box button:hover {
            background: #157347;
        }

        #loginMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header>

        <h1>
            ⚽ TurfBook Admin
        </h1>

        <nav>

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>


    <!-- =========================================
         ADMIN LOGIN
    ========================================== -->

    <section class="admin-login-section">

        <div class="admin-login-box">

            <h2>
                🔐 Admin Login
            </h2>

            <p>
                Login with your administrator account
                to access the TurfBook dashboard.
            </p>


            <form id="adminLoginForm">

                <input type="email" id="adminEmail" placeholder="Admin Email" required>


                <input type="password" id="adminPassword" placeholder="Admin Password" required>


                <button type="submit">
                    Login as Admin
                </button>

            </form>


            <p id="loginMessage"></p>

        </div>

    </section>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer>

        <p>
            © 2026 TurfBook. All Rights Reserved.
        </p>

    </footer>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        const API_URL =
            "http://localhost:5000/api";


        document
            .getElementById("adminLoginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById(
                                "adminEmail"
                            )
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById(
                                "adminPassword"
                            )
                            .value;


                    const message =
                        document
                            .getElementById(
                                "loginMessage"
                            );


                    message.textContent =
                        "Logging in...";


                    message.style.color =
                        "#555";


                    try {

                        const response =
                            await fetch(
                                `${API_URL}/auth/admin-login`,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email:
                                                email,

                                            password:
                                                password
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                "Admin login failed"
                            );

                        }


                        // =================================
                        // CHECK TOKEN
                        // =================================

                        if (!data.token) {

                            throw new Error(
                                "No authentication token received."
                            );

                        }


                        // =================================
                        // SAVE ADMIN LOGIN
                        // =================================

                        localStorage.setItem(
                            "adminToken",
                            data.token
                        );


                        if (data.user) {

                            localStorage.setItem(
                                "adminUser",
                                JSON.stringify(
                                    data.user
                                )
                            );

                        }


                        // Remove normal user token
                        localStorage.removeItem(
                            "token"
                        );


                        message.textContent =
                            "Admin login successful! Redirecting...";


                        message.style.color =
                            "green";


                        // =================================
                        // OPEN ADMIN DASHBOARD
                        // =================================

                        setTimeout(
                            function () {

                                window.location.href =
                                    "admin.html";

                            },
                            700
                        );


                    } catch (error) {

                        console.error(
                            "Admin Login Error:",
                            error
                        );


                        message.textContent =
                            error.message ||
                            "Admin login failed.";


                        message.style.color =
                            "red";

                    }

                }
            );

    </script>

</body>

</html>
